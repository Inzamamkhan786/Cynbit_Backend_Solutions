services:
  postgres:
    image: postgres:16-alpine
    container_name: cynbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cynbit_db
    ports:
      - "5432:5432"
    volumes:
      - cynbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cynbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cynbit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cynbit_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cynbit_pgdata:
  cynbit_redisdata:
